name: Playwright Cucumber Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-cucumber-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run test:typecheck

  test:
    name: ${{ matrix.browser }} scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Cucumber scenarios
        id: cucumber_tests
        continue-on-error: true
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          BASE_URL: ${{ secrets.BASE_URL || 'https://the-internet.herokuapp.com' }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME || 'tomsmith' }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'SuperSecretPassword!' }}
          HOME: /root
        run: npm test

      - name: Publish scenario counts
        id: test_summary
        if: always()
        env:
          BROWSER: ${{ matrix.browser }}
        run: python3 .github/scripts/publish_test_summary.py

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.browser }}-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure diagnostics
        if: steps.cucumber_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.browser }}-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail workflow when scenarios fail
        if: steps.cucumber_tests.outcome == 'failure'
        run: |
          echo "::error title=${{ matrix.browser }} scenarios failed::${{ steps.test_summary.outputs.failed }} failed, ${{ steps.test_summary.outputs.passed }} passed"
          exit 1
